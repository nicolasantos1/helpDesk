services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: helpdesk
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - helpdesk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      retries: 10
volumes:
  helpdesk_data:
