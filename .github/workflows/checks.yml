name: Verify HelpDesk
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: ci-password-only
          POSTGRES_DB: helpdesk
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U helpdesk' --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://helpdesk:ci-password-only@localhost:5432/helpdesk
      DIRECT_URL: postgresql://helpdesk:ci-password-only@localhost:5432/helpdesk
      APP_URL: http://localhost:3000
      SEED_PASSWORD: ci-demo-password-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            docs/*results.json
            docs/evidence/
            test-results/
